[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "E712", "E741"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
